! INET, AS65100. eth1 -> isp-a, eth2 -> isp-b, eth3 -> target
frr version 10.5
frr defaults traditional
hostname inet
log stdout informational
service integrated-vtysh-config
!
ip forwarding
!
interface eth1
 description to-isp-a
 ip address 10.3.0.2/30
exit
!
interface eth2
 description to-isp-b
 ip address 10.4.0.2/30
exit
!
interface eth3
 description to-target
 ip address 198.51.100.1/24
exit
!
router bgp 65100
 bgp router-id 198.51.100.1
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.3.0.1 remote-as 65001
 neighbor 10.3.0.1 description isp-a
 neighbor 10.4.0.1 remote-as 65002
 neighbor 10.4.0.1 description isp-b
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 10.3.0.1 activate
  neighbor 10.4.0.1 activate
 exit-address-family
exit
!
