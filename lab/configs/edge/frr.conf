! EDGE router, AS65000.
! eth1 -> client, eth2 -> isp-a, eth3 -> isp-b, eth4 -> optimizer
frr version 10.5
frr defaults traditional
hostname edge
log stdout informational
service integrated-vtysh-config
!
ip forwarding
!
interface eth1
 description to-client
 ip address 203.0.113.1/24
exit
!
interface eth2
 description to-isp-a
 ip address 10.1.0.1/30
exit
!
interface eth3
 description to-isp-b
 ip address 10.2.0.1/30
exit
!
interface eth4
 description to-optimizer
 ip address 10.9.0.1/30
exit
!
! Probe source addresses live on the optimizer. Policy routing that pins
! probe traffic to a specific ISP is done in the kernel (ip rule), see
! lab/topology.clab.yml.
ip route 10.99.1.0/24 10.9.0.2
ip route 10.99.2.0/24 10.9.0.2
!
! ---- Outbound: strictly our own prefixes only -------------------------
ip prefix-list PL-OUT-ISP-A seq 10 permit 203.0.113.0/24
ip prefix-list PL-OUT-ISP-A seq 20 permit 10.99.1.0/24
!
ip prefix-list PL-OUT-ISP-B seq 10 permit 203.0.113.0/24
ip prefix-list PL-OUT-ISP-B seq 20 permit 10.99.2.0/24
!
! ---- What the optimizer is allowed to inject --------------------------
! never our own space, no default route, nothing longer than /24
ip prefix-list PL-OPTIMIZER-IN seq 10 deny 203.0.113.0/24 le 32
ip prefix-list PL-OPTIMIZER-IN seq 20 deny 10.0.0.0/8 le 32
ip prefix-list PL-OPTIMIZER-IN seq 30 permit 0.0.0.0/0 ge 8 le 24
!
! next-hop must be one of the directly connected ISP routers
ip prefix-list PL-OPTIMIZER-NH seq 10 permit 10.1.0.2/32
ip prefix-list PL-OPTIMIZER-NH seq 20 permit 10.2.0.2/32
!
! injected routes must carry no-advertise (defence in depth: they never leave edge)
bgp community-list standard CL-NO-ADVERTISE seq 10 permit no-advertise
!
route-map RM-ISP-A-IN permit 10
 description base policy: ISP-A is the preferred upstream
 set local-preference 150
exit
!
route-map RM-ISP-B-IN permit 10
exit
!
route-map RM-ISP-A-OUT permit 10
 match ip address prefix-list PL-OUT-ISP-A
exit
!
route-map RM-ISP-B-OUT permit 10
 match ip address prefix-list PL-OUT-ISP-B
exit
!
route-map RM-OPTIMIZER-IN permit 10
 match ip address prefix-list PL-OPTIMIZER-IN
 match ip next-hop prefix-list PL-OPTIMIZER-NH
 match community CL-NO-ADVERTISE
exit
!
! the optimizer does not need our table
route-map RM-OPTIMIZER-OUT deny 10
exit
!
router bgp 65000
 bgp router-id 203.0.113.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.1.0.2 remote-as 65001
 neighbor 10.1.0.2 description isp-a
 neighbor 10.2.0.2 remote-as 65002
 neighbor 10.2.0.2 description isp-b
 neighbor 10.9.0.2 remote-as 65000
 neighbor 10.9.0.2 description optimizer
 neighbor 10.9.0.2 passive
 ! short timers: if the optimizer dies silently, injected routes go away in <=9s
 neighbor 10.9.0.2 timers 3 9
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  network 10.99.1.0/24
  network 10.99.2.0/24
  neighbor 10.1.0.2 activate
  neighbor 10.1.0.2 route-map RM-ISP-A-IN in
  neighbor 10.1.0.2 route-map RM-ISP-A-OUT out
  neighbor 10.2.0.2 activate
  neighbor 10.2.0.2 route-map RM-ISP-B-IN in
  neighbor 10.2.0.2 route-map RM-ISP-B-OUT out
  neighbor 10.9.0.2 activate
  neighbor 10.9.0.2 route-map RM-OPTIMIZER-IN in
  neighbor 10.9.0.2 route-map RM-OPTIMIZER-OUT out
 exit-address-family
exit
!
