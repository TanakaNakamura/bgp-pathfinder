# ExaBGP 4.2 configuration for the optimizer node.
# Syntax checked with `exabgp --test` against exabgp==4.2.25.

process optimizer {
    # Wrapper: if the optimizer exits for any reason it terminates ExaBGP,
    # so the iBGP session drops and every injected route disappears.
    run /usr/local/bin/run-optimizer.sh;
    encoder json;
}

neighbor 10.9.0.1 {
    description "edge";
    router-id 10.9.0.2;
    local-address 10.9.0.2;
    local-as 65000;
    peer-as 65000;
    hold-time 9;

    family {
        ipv4 unicast;
    }

    api {
        processes [ optimizer ];
        neighbor-changes;
    }
}
